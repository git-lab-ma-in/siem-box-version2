#=========================
#   Linux Auth (SSH) - /var/log/auth.log của máy chủ web
#=========================
# Nguồn: Filebeat chạy TRÊN máy chủ web (web-server-agent/), KHÔNG chạy trong
# docker-compose này. Xem web-server-agent/README.md.

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics             => ["logs-linux-auth-default"]
    group_id           => "logstash-linux-auth-consumer"
    codec              => json
    auto_offset_reset  => "earliest"
    consumer_threads   => 1
  }
}

filter {
  grok {
    match => {
      "message" => "%{SYSLOGTIMESTAMP:auth.timestamp} %{SYSLOGHOST:auth.hostname} %{DATA:auth.program}(?:\[%{POSINT:auth.pid}\])?: %{GREEDYDATA:auth.message}"
    }
    tag_on_failure => ["_auth_grok_failure"]
  }

  if "_auth_grok_failure" not in [tags] {
    date {
      match        => ["auth.timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target       => "@timestamp"
      remove_field => ["auth.timestamp"]
    }

    mutate {
      add_field => {
        "event.kind"     => "event"
        "event.category" => "authentication"
        "event.dataset"  => "linux.auth"
      }
    }

    if [auth.program] == "sshd" {
      grok {
        match => {
          "auth.message" => [
            "Failed password for invalid user %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int} ssh2",
            "Failed password for %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int} ssh2",
            "Invalid user %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int}",
            "Accepted password for %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int} ssh2",
            "Accepted publickey for %{USERNAME:user.name} from %{IPORHOST:source.ip} port %{NUMBER:source.port:int}"
          ]
        }
        tag_on_failure => ["_auth_sshd_no_match"]
      }

      if "_auth_sshd_no_match" not in [tags] {
        mutate {
          add_field => { "event.type" => "start" }
        }

        if [auth.message] =~ /^Failed|^Invalid/ {
          mutate { add_field => { "event.outcome" => "failure" } }
        } else if [auth.message] =~ /^Accepted/ {
          mutate { add_field => { "event.outcome" => "success" } }
        }
      }
    }
  }
}

output {
  # Quy ước: index TRÙNG với tên topic đầu vào (logs-linux-auth-default).
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "logs-linux-auth-default"
    action   => "create"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
  }
}
