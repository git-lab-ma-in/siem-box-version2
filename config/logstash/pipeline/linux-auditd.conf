#=========================
#   Linux auditd - /var/log/audit/audit.log của máy chủ web
#=========================
# Nguồn: Filebeat chạy TRÊN máy chủ web (web-server-agent/), KHÔNG chạy trong
# docker-compose này. Rule auditd cài trên máy đó (xem
# web-server-agent/audit-rules/siem-webshell.rules) gắn key="webshell_exec"
# cho mọi execve chạy dưới euid của www-data — đây là điều kiện chính mà
# rules/sigma/webshell-exec.yml tìm kiếm.

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics             => ["logs-linux-auditd-default"]
    group_id           => "logstash-linux-auditd-consumer"
    codec              => json
    auto_offset_reset  => "earliest"
    consumer_threads   => 1
  }
}

filter {
  # Dòng auditd điển hình:
  # type=SYSCALL msg=audit(1737000000.123:456): arch=c000003e syscall=59 ... \
  #   comm="bash" exe="/usr/bin/bash" key="webshell_exec"
  grok {
    match => {
      "message" => "type=%{WORD:auditd.type} msg=audit\(%{NUMBER:auditd.epoch}:%{NUMBER:auditd.serial}\):%{GREEDYDATA:auditd.kv}"
    }
    tag_on_failure => ["_auditd_grok_failure"]
  }

  if "_auditd_grok_failure" not in [tags] {
    date {
      match        => ["auditd.epoch", "UNIX"]
      target       => "@timestamp"
    }

    kv {
      source      => "auditd.kv"
      field_split => " "
      value_split => "="
      trim_key    => " "
      trim_value  => "\""
      target       => "auditd.fields"
    }

    mutate {
      rename => {
        "[auditd][fields][comm]" => "process.name"
        "[auditd][fields][exe]"  => "process.executable"
        "[auditd][fields][pid]"  => "process.pid"
        "[auditd][fields][ppid]" => "process.parent.pid"
        "[auditd][fields][uid]"  => "[user][id]"
        "[auditd][fields][euid]" => "[user][effective][id]"
        "[auditd][fields][key]"  => "key"
        "[auditd][fields][syscall]" => "auditd.syscall"
        "[auditd][fields][success]" => "auditd.success"
      }
      add_field => {
        "event.kind"     => "event"
        "event.category" => "process"
        "event.type"     => "start"
        "event.dataset"  => "linux.auditd"
        "event.provider" => "auditd"
      }
    }
  }
}

output {
  # Quy ước: index TRÙNG với tên topic đầu vào (logs-linux-auditd-default).
  elasticsearch {
    hosts    => ["https://es01:9200"]
    index    => "logs-linux-auditd-default"
    action   => "create"
    user     => "${ELASTIC_USER}"
    password => "${ELASTIC_PASSWORD}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
  }
}
