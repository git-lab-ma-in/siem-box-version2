# filebeat.yml — chạy TRỰC TIẾP trên máy chủ web (không phải Docker).
# Đây là file mẫu; install.sh sẽ envsubst 2 biến ${SIEM_EXTERNAL_HOST} và
# ${KAFKA_EXTERNAL_PORT} từ web-server-agent/.env rồi ghi ra
# /etc/filebeat/filebeat.yml. Không sửa trực tiếp file đã cài ở /etc/filebeat —
# sửa file mẫu này rồi chạy lại install.sh.

filebeat.inputs:
  # --- Nguồn 1: Nginx access log của web server đang giám sát ---
  - type: log
    id: nginx-access
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      topic: logs-nginx-default
    fields_under_root: false

  # --- Nguồn 2: SSH / PAM auth log ---
  # Debian/Ubuntu dùng /var/log/auth.log, RHEL/CentOS/Alma dùng /var/log/secure.
  # Filebeat bỏ qua êm path nào không tồn tại, không cần chỉnh theo distro.
  - type: log
    id: linux-auth
    enabled: true
    paths:
      - /var/log/auth.log
      - /var/log/secure
    fields:
      topic: logs-linux-auth-default
    fields_under_root: false

  # --- Nguồn 3: auditd (kèm rule webshell_exec, xem audit-rules/) ---
  - type: log
    id: linux-auditd
    enabled: true
    paths:
      - /var/log/audit/audit.log
    fields:
      topic: logs-linux-auditd-default
    fields_under_root: false

# Gửi thẳng vào Kafka trên SIEM box qua listener EXTERNAL (PLAINTEXT, xem
# README của siem-box mục "Vì sao Kafka không có TLS"). Topic được chọn động
# theo field "fields.topic" khai báo ở mỗi input phía trên.
output.kafka:
  hosts: ["${SIEM_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}"]
  topic: '%{[fields.topic]}'
  partition.round_robin:
    reachable_only: false
  required_acks: 1
  compression: gzip
  max_message_bytes: 1000000

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
